# Build, unit/behaviour tests and a vulnerability audit on every push to a branch and every pull request; the UI
# Automation suite is compiled too. It isn't run here: it needs a warm profile, an interactive desktop and (for Ask)
# a local model, so it runs on a PC with scripts/e2e.ps1, every side effect kept in the --e2e dry-run sandbox.
name: ci

on:
  push:
    branches: ['**']   # tags are the release workflow's
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (the release in the comment); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # One command per step: a step's PowerShell script only fails on its last command's exit code, so a failing
      # first command in a two-line step went unnoticed (a lock-file mismatch then surfaced as "no test results").
      - name: Restore (locked, signed packages only)
        run: dotnet restore AquaHub.sln --locked-mode
      # The UI tests aren't locked: they ship nothing, their versions are pinned in Directory.Packages.props, and a lock
      # file of their own made every shared package's Dependabot update fail the locked restore.
      - name: Restore the UI tests
        run: dotnet restore tests/AquaHub.E2E/AquaHub.E2E.csproj
      - name: Build
        run: dotnet build AquaHub.sln -c Release --no-restore
      - name: Build the UI tests
        run: dotnet build tests/AquaHub.E2E/AquaHub.E2E.csproj -c Release --no-restore
      # TreatNoTestsAsError: a run that finds no tests (a test adapter that stopped matching, say) fails instead of passing.
      - name: Unit & behaviour tests
        run: dotnet test tests/AquaHub.Tests/AquaHub.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx" --blame-hang-timeout 5m -- RunConfiguration.TreatNoTestsAsError=true
      - name: Enough tests ran
        shell: pwsh
        run: |
          [xml]$trx = Get-Content tests/AquaHub.Tests/TestResults/unit.trx
          $c = $trx.TestRun.ResultSummary.Counters
          "Tests: $($c.total) found, $($c.executed) run, $($c.passed) passed"
          if ([int]$c.executed -lt 1000) { throw "Only $($c.executed) tests ran (there are over 1,000): has test discovery broken?" }
      # Other calendars and number formats are where culture bugs hide (a Thai date once reached an English prompt).
      - name: Unit tests as on a Thai PC
        run: dotnet test tests/AquaHub.Tests/AquaHub.Tests.csproj -c Release --no-build --blame-hang-timeout 5m -- RunConfiguration.TreatNoTestsAsError=true
        env:
          AQUAHUB_TEST_CULTURE: th-TH
      - name: Unit tests as on an Arabic (Saudi) PC
        run: dotnet test tests/AquaHub.Tests/AquaHub.Tests.csproj -c Release --no-build --blame-hang-timeout 5m -- RunConfiguration.TreatNoTestsAsError=true
        env:
          AQUAHUB_TEST_CULTURE: ar-SA
      - name: Vulnerability audit (fails on any known-vulnerable package)
        shell: pwsh
        run: |
          $out = dotnet list AquaHub.sln package --vulnerable --include-transitive 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { throw 'The audit could not run (see above).' }
          if ($out -match 'has the following vulnerable packages') { throw 'Known-vulnerable packages (see above).' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-test-results
          path: tests/AquaHub.Tests/TestResults

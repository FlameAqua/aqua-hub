# Build, unit/behaviour tests and a vulnerability audit on every push to a branch and every pull request; the UI
# Automation suite is compiled too. It isn't run here: it needs a warm profile, an interactive desktop and (for Ask)
# a local model, so it runs on a PC with scripts/e2e.ps1, every side effect kept in the --e2e dry-run sandbox.
name: ci

on:
  push:
    branches: ['**']   # tags are the release workflow's
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (the release in the comment); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore (locked, signed packages only)
        run: |
          dotnet restore AquaHub.sln --locked-mode
          dotnet restore tests/AquaHub.E2E/AquaHub.E2E.csproj --locked-mode
      - name: Build
        run: |
          dotnet build AquaHub.sln -c Release --no-restore
          dotnet build tests/AquaHub.E2E/AquaHub.E2E.csproj -c Release --no-restore
      - name: Unit & behaviour tests
        run: dotnet test tests/AquaHub.Tests/AquaHub.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx"
      - name: Vulnerability audit (fails on any known-vulnerable package)
        shell: pwsh
        run: |
          $out = dotnet list AquaHub.sln package --vulnerable --include-transitive 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { throw 'The audit could not run (see above).' }
          if ($out -match 'has the following vulnerable packages') { throw 'Known-vulnerable packages (see above).' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-test-results
          path: tests/AquaHub.Tests/TestResults

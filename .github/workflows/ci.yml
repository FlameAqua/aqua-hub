# Build, unit/behaviour tests and a vulnerability audit on every push. The UI Automation end-to-end suite needs a
# warm profile and an interactive desktop, so it runs on demand (Actions > ci > Run workflow); locally, scripts/e2e.ps1
# sets it up and runs it. All of its side effects stay in the --e2e dry-run sandbox.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so a newer SDK on the runner can't switch the target framework (the lock files are for .NET 9).
  AQUA_NET: net9.0

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore (locked, signed packages only)
        run: dotnet restore AquaHub.sln --locked-mode -p:AquaNet=${{ env.AQUA_NET }}
      - name: Build
        run: dotnet build AquaHub.sln -c Release --no-restore -p:AquaNet=${{ env.AQUA_NET }}
      - name: Unit & behaviour tests
        run: dotnet test tests/AquaHub.Tests/AquaHub.Tests.csproj -c Release --no-build -p:AquaNet=${{ env.AQUA_NET }} --logger "trx;LogFileName=unit.trx"
      - name: Vulnerability audit
        run: dotnet list AquaHub.sln package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: tests/AquaHub.Tests/TestResults

  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: build-and-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Publish the app under test
        run: dotnet publish src/AquaHub/AquaHub.csproj -c Release -p:AquaNet=${{ env.AQUA_NET }} -o ${{ runner.temp }}/aquahub
      - name: UI Automation end-to-end suite (dry-run sandbox, no local model on CI)
        env:
          AQUAHUB_E2E_EXE: ${{ runner.temp }}/aquahub/AquaHub.exe
          AQUAHUB_E2E_ROOT: ${{ runner.temp }}/e2e
        run: dotnet test tests/AquaHub.E2E/AquaHub.E2E.csproj -p:AquaNet=${{ env.AQUA_NET }} --logger "trx;LogFileName=e2e.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: tests/AquaHub.E2E/TestResults

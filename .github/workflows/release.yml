# Publishes a release when a version tag is pushed (git tag v1.1.0 && git push origin v1.1.0): checks the tag is on
# main, builds and tests, then packages with Velopack into Setup.exe, a portable zip and the update packages that
# installed copies download (full, plus a delta from the previous release). Installed copies look for these on this
# repository's releases, so the repository must be public.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the GitHub release and upload its files

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Read through the environment, never pasted into scripts: a tag name can contain shell syntax.
      REF: ${{ github.ref_name }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      # Actions are pinned to full commit SHAs (the release in the comment); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # for the release notes (commits since the previous tag) and the on-main check
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Version from the tag; the tag must be on main
        id: version
        shell: pwsh
        run: |
          $v = $env:REF.Substring(1)
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tags look like v1.2.3 (got $env:REF)" }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "$env:REF isn't on main: only merged work is released." }
          $prev = git describe --tags --abbrev=0 "$env:REF^" 2>$null
          if ($LASTEXITCODE -ne 0) { $prev = '' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "previous=$prev" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      # One locked restore covers the publish too: the app's lock file includes win-x64 (RuntimeIdentifiers in the
      # project), and ReadyToRun brings the compiler packs it needs.
      - name: Restore (locked, signed packages only)
        run: dotnet restore AquaHub.sln --locked-mode -p:PublishReadyToRun=true
      - name: Build
        run: dotnet build AquaHub.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}
      - name: Unit & behaviour tests
        run: dotnet test tests/AquaHub.Tests/AquaHub.Tests.csproj -c Release --no-build

      - name: Publish the app (framework-dependent, ReadyToRun)
        run: >
          dotnet publish src/AquaHub/AquaHub.csproj -c Release -r win-x64 --self-contained false --no-restore -o publish
          -p:PublishReadyToRun=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -p:UpdateRepository=$env:REPO_URL

      - name: Release notes (the commits since the previous tag)
        shell: pwsh
        env:
          PREV: ${{ steps.version.outputs.previous }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $range = if ($env:PREV) { "$env:PREV..$env:REF" } else { $env:REF }
          $lines = @(git log --no-merges --pretty='format:- %s' $range)
          (@("## Aqua Hub $env:VERSION", '') + $lines) -join "`n" | Set-Content -Encoding utf8 release-notes.md
          Get-Content release-notes.md

      # Velopack: keep this version and the Velopack package in Directory.Packages.props in step.
      - name: Install Velopack's packaging tool
        run: dotnet tool install -g vpk --version 1.2.161
      - name: Fetch the previous release (to build a delta update from it)
        if: steps.version.outputs.previous != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vpk download github --repoUrl $env:REPO_URL --token $env:GH_TOKEN
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          vpk pack --packId AquaHub.App --packVersion $env:VERSION --packDir publish
          --mainExe AquaHub.exe --packTitle "Aqua Hub" --packAuthors "Aqua Hub"
          --icon src/AquaHub/Assets/AquaHub.ico --framework net10-x64-desktop --releaseNotes release-notes.md
      - name: Upload the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          vpk upload github --repoUrl $env:REPO_URL --token $env:GH_TOKEN
          --publish --releaseName "Aqua Hub $env:VERSION" --tag $env:REF

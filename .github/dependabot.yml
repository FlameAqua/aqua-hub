# Weekly pull requests for newer GitHub Actions (they're pinned to commit SHAs) and NuGet packages (pinned in
# Directory.Packages.props, locked in packages.lock.json). Review each one like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    # Every version is in Directory.Packages.props; the UI test project (outside AquaHub.sln) has no lock file, so
    # an update only has to change the solution's lock files, which Dependabot regenerates.
    directory: /
    schedule:
      interval: weekly
    groups:
      test-packages:
        patterns: ['xunit*', 'Microsoft.NET.Test.Sdk']
